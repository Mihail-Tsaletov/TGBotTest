<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Ошибка — GlowDent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .error-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 600px;
      width: 90%;
    }
    .error-icon {
      font-size: 80px;
      color: #e74c3c;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2.5em;
      margin: 20px 0;
      color: #2c3e50;
    }
    p {
      font-size: 1.2em;
      color: #7f8c8d;
      margin-bottom: 40px;
    }
    .btn-back {
      padding: 14px 32px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.3s;
    }
    .btn-back:hover {
      background: #2980b9;
    }
    footer {
      margin-top: 50px;
      font-size: 0.9em;
      color: #95a5a6;
    }
  </style>
</head>
<body>
<div class="error-container">
  <div class="error-icon">⚠️</div>
  <h1>Что-то пошло не так</h1>
  <p>Произошла ошибка на сервере. Мы уже работаем над этим.<br>Пожалуйста, попробуйте позже или вернитесь назад.</p>

  <a href="javascript:history.back()" class="btn-back">← Назад</a>

  <footer>
    Админ-панель GlowDent | <span th:text="${#temporals.format(#temporals.createNow(), 'dd.MM.yyyy HH:mm')}"></span>
  </footer>
</div>
</body>
</html>
