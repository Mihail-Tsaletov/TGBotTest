<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заявки на подтверждение</title>
    <style>
        /* Шапка */
        .header {
            background: #2c3e50;
            padding: 20px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .header-content {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 {
            margin: 0;
            font-size: 1.8em;
        }
        .tabs {
            display: flex;
            gap: 15px;
        }
        .tab {
            padding: 12px 30px;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-size: 1.1em;
            transition: background 0.3s;
        }
        .tab:hover {
            background: rgba(255,255,255,0.25);
        }
        .tab.active {
            background: #3498db;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .header-content { flex-direction: column; text-align: center; }
            .tabs { margin-top: 15px; }
        }
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 25px; }
        .card-header { font-size: 1.3em; font-weight: bold; color: #2c3e50; margin-bottom: 15px; }
        .card-header.new { background: #e8f5e8; } /* новая заявка */
        .card-header.cancel { background: #ffebee; color: #c62828; } /* запрос на отмену */
        .card-header.reschedule { background: #fff3e0; color: #ef6c00; } /* запрос на перенос */
        .info { margin: 10px 0; font-size: 1.1em; }
        .info strong { color: #34495e; }
        .buttons { margin-top: 25px; display: flex; gap: 15px; flex-wrap: wrap; }
        button { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .btn-cancel { background: #e74c3c; color: white; }
        .btn-confirm { background: #27ae60; color: white; }
        .btn-save { background: #2980b9; color: white; }
        .edit-form { display: none; margin-top: 20px; padding: 20px; background: #f9f9f9; border-radius: 8px; }
        .edit-form.show { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; }
        .form-group input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .no-records { text-align: center; font-size: 1.6em; color: #7f8c8d; margin-top: 60px; }
    </style>
</head>
<body>
<div class="header">
    <div class="header-content">
        <h1>Админ-панель стоматологии</h1>
        <div class="tabs">
            <a class="tab" th:href="@{/tg/admin/orders}"
               th:classappend="${currentPage == 'orders'} ? 'active' : ''">Ожидающие</a>
            <a class="tab" th:href="@{/tg/admin/completed}"
               th:classappend="${currentPage == 'completed'} ? 'active' : ''">Итоговые</a>
            <a class="tab" th:href="@{/tg/admin/broadcast}"
               th:classappend="${currentPage == 'broadcast'} ? 'active' : ''">Рассылка</a>
        </div>
    </div>
</div>
<div class="container">
    <h1>Ожидающие подтверждения заявки</h1>

    <div class="cards" th:unless="${orders.isEmpty()}">
        <div class="card" th:each="order : ${orders}">
            <!-- Заголовок с цветом в зависимости от статуса -->
            <div class="card-header new"
                 th:text="${order.status == 'pending_cancel'
                ? 'Запрос на отмену записи'
                : (order.status == 'pending_reschedule'
                   ? 'Запрос на перенос записи'
                   : 'Новая заявка на запись')} + ' #' + ${order.id}">
                Новая заявка
            </div>

            <!-- Общие данные -->
            <div class="info"><strong>Пациент:</strong> <span th:text="${order.user.fullName} ?: 'Не указано'"></span></div>
            <div class="info"><strong>Телефон:</strong> <span th:text="${order.user.phone} ?: 'Не указан'"></span></div>
            <div class="info" th:if="${order.appointmentDate != null}">
                <strong>Текущая запись:</strong>
                <span th:text="${#temporals.format(order.appointmentDate, 'dd.MM.yyyy HH:mm')}"></span>
                у <span th:text="${order.doctor?.fullName} ?: 'Любой врач'"></span>
            </div>
            <div class="info">
                <strong>Дата создания:</strong>
                <span th:text="${order.createdAt != null ? #temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm') : 'Неизвестно'}">
                        Неизвестно
                    </span>
            </div>

            <!-- Кнопки в зависимости от статуса -->
            <div class="buttons">
                <!-- Запрос на отмену -->
                <th:block th:if="${order.status == 'pending_cancel'}">
                    <form th:action="@{|/tg/admin/order/${order.id}/cancel|}" method="post" style="display:inline;">
                        <button type="submit" class="btn-cancel">Отменить запись</button>
                    </form>
                    <button type="button" class="btn-confirm" th:onclick="|showRescheduleForm(${order.id})|">
                        Перенести запись
                    </button>
                </th:block>

                <!-- Запрос на перенос -->
                <th:block th:if="${order.status == 'pending_reschedule'}">
                    <button type="button" class="btn-confirm" th:onclick="|showRescheduleForm(${order.id})|">
                        Подтвердить перенос
                    </button>
                </th:block>

                <!-- Обычная новая заявка -->
                <th:block th:if="${order.status == 'pending'}">
                    <form th:action="@{|/tg/admin/order/${order.id}/cancel|}" method="post" style="display:inline;">
                        <button type="submit" class="btn-cancel">Отменить</button>
                    </form>
                    <button type="button" class="btn-confirm" th:onclick="|showEditForm(${order.id})|">
                        Подтвердить запись
                    </button>
                </th:block>
            </div>

            <!-- Форма подтверждения новой заявки (для pending) -->
            <div class="edit-form" th:id="|edit-form-${order.id}|">
                <form th:action="@{|/tg/admin/order/${order.id}/confirm|}" method="post">
                    <div class="form-group">
                        <label>Врач</label>
                        <select name="doctorId" required>
                            <option value="">-- Выберите врача --</option>
                            <option th:each="doc : ${doctors}" th:value="${doc.id}" th:text="${doc.fullName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Дата и время приёма</label>
                        <input type="datetime-local" name="appointmentDate" required />
                    </div>
                    <button type="submit" class="btn-save">Сохранить и подтвердить</button>
                </form>
            </div>

            <!-- Форма переноса (для pending_cancel и pending_reschedule) -->
            <div class="edit-form" th:id="|reschedule-form-${order.id}|">
                <form th:action="@{|/tg/admin/reschedule/${order.id}|}" method="post">
                    <div class="form-group">
                        <label>Новый врач</label>
                        <select name="doctorId" required>
                            <option value="">-- Выберите врача --</option>
                            <option th:each="doc : ${doctors}" th:value="${doc.id}" th:text="${doc.fullName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Новая дата и время приёма</label>
                        <input type="datetime-local" name="newAppointmentDate" required />
                    </div>
                    <button type="submit" class="btn-save">Сохранить перенос</button>
                </form>
            </div>
        </div>
    </div>

    <div class="no-records" th:if="${orders.isEmpty()}">
        Нет заявок на обработку
    </div>
</div>

<script>
    function showEditForm(orderId) {
        document.getElementById('edit-form-' + orderId).classList.add('show');
    }

    function showRescheduleForm(orderId) {
        document.getElementById('reschedule-form-' + orderId).classList.add('show');
    }
</script>
</body>
</html>
