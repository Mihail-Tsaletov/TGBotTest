<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление врачами</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .header {
            background: #2c3e50;
            padding: 20px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .header-content {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 {
            margin: 0;
            font-size: 1.8em;
        }
        .tabs {
            display: flex;
            gap: 15px;
        }
        .tab {
            padding: 12px 30px;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-size: 1.1em;
            transition: background 0.3s;
        }
        .tab:hover {
            background: rgba(255,255,255,0.25);
        }
        .tab.active {
            background: #3498db;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .header-content { flex-direction: column; text-align: center; }
            .tabs { margin-top: 15px; }
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .form-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }
        .doctor-card {
            background: white;
            border-radius: 12px;
            padding: 60px 20px 20px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .edit-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f4f4f4;
            color: #555;
            border: 1px solid #d5d5d5;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .edit-btn:hover { background: #e6e6e6; }
        .edit-btn svg { width: 18px; height: 18px; }
        .delete-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #fff;
            color: #c0392b;
            border: 1px solid #e6b3b3;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            padding: 0;
        }
        .delete-btn:hover { background: #ffebee; }
        .photo-container, .video-container {
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 8px;
            margin: 12px 0;
            overflow: hidden;
        }
        .doctor-card img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            border-radius: 8px;
            object-fit: contain;
        }
        .doctor-card video {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }
        .edit-form {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .edit-form.show { display: block; }
        .success { color: #27ae60; padding: 12px; background: #e8f5e8; border-radius: 6px; }
        .error { color: #e74c3c; padding: 12px; background: #ffebee; border-radius: 6px; }
    </style>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script>
    (function () {
        function connectNotifications() {
            const socket = new SockJS('/ws');
            const stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                console.log('Connected to WebSocket');
                stompClient.subscribe('/topic/new-orders', function (message) {
                    try {
                        const data = JSON.parse(message.body);
                        showNewOrderToast(data);
                    } catch (e) {
                        console.error('Parse error', e);
                    }
                });
            }, function (error) {
                console.error('STOMP error', error);
                setTimeout(connectNotifications, 5000);
            });
        }

        window.addEventListener('load', connectNotifications);

        function showNewOrderToast(data) {
            const toast = document.createElement('div');
            toast.textContent = '🦷 Новая заявка №' + data.orderId;
            toast.style.cssText =
                'position:fixed;bottom:20px;right:20px;background:#27ae60;color:#fff;' +
                'padding:16px 24px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,0.25);' +
                'z-index:9999;font-size:16px;font-family:Arial,sans-serif;cursor:pointer;' +
                'transition:opacity 0.3s;';
            toast.onclick = function () {
                window.location.href = '/tg/admin/orders';
            };
            document.body.appendChild(toast);

            setTimeout(function () {
                toast.style.opacity = '0';
                setTimeout(function () { toast.remove(); }, 300);
            }, 8000);
        }
    })();
</script>
<body>

<!-- ШАПКА С ВКЛАДКАМИ -->
<div class="header">
    <div class="header-content">
        <h1>Админ-панель стоматологии</h1>
        <div class="tabs">
            <a class="tab" th:href="@{/tg/admin/orders}"
               th:classappend="${currentPage == 'orders'} ? 'active' : ''">Ожидающие</a>
            <a class="tab" th:href="@{/tg/admin/completed}"
               th:classappend="${currentPage == 'completed'} ? 'active' : ''">Итоговые</a>
            <a class="tab" th:href="@{/tg/admin/broadcast}"
               th:classappend="${currentPage == 'broadcast'} ? 'active' : ''">Рассылка</a>
            <a class="tab" th:href="@{/tg/admin/doctors}"
               th:classappend="${currentPage == 'doctors'} ? 'active' : ''">Врачи</a>
        </div>
    </div>
</div>

<div class="container">

    <div class="form-card">
        <h2>Добавить врача</h2>
        <form th:action="@{/tg/admin/doctors}" method="post" enctype="multipart/form-data">
            <label>ФИО врача:</label><br>
            <input type="text" name="fullName" required style="width:100%; padding:10px; margin:8px 0;"><br>

            <label>Фото врача (обязательно):</label><br>
            <input type="file" name="photo" accept="image/*" required><br><br>

            <label>Видео-визитка (необязательно):</label><br>
            <input type="file" name="video" accept="video/*"><br><br>

            <button type="submit" style="padding:12px 30px; background:#27ae60; color:white; border:none; border-radius:6px; font-size:16px;">
                Добавить врача
            </button>
        </form>
    </div>

    <h2>Список врачей</h2>
    <div class="doctors-grid">
        <div class="doctor-card" th:each="doctor : ${doctors}">
            <form th:action="@{/tg/admin/doctors/{id}/delete(id=${doctor.id})}" method="post"
                  th:attr="data-doctor-name=${doctor.fullName}"
                  onsubmit="return confirm('Удалить врача ' + this.dataset.doctorName + '? Все его заявки тоже будут удалены безвозвратно.')"
                  style="display:inline;">
                <button type="submit" class="delete-btn" title="Удалить врача">✕</button>
            </form>

            <button class="edit-btn" type="button" th:onclick="|toggleEdit(${doctor.id})|" title="Редактировать">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                </svg>
            </button>

            <h3 th:text="${doctor.fullName}" th:id="|name-${doctor.id}|"></h3>

            <div th:if="${doctor.photoUrl}">
                <strong>Фото:</strong><br>
                <div class="photo-container">
                    <img th:src="${doctor.photoUrl}" alt="Фото врача" th:id="|photo-img-${doctor.id}|">
                </div>
            </div>

            <div th:if="${doctor.videoUrl}">
                <strong>Видео-визитка:</strong><br>
                <div class="video-container">
                    <video controls th:id="|video-player-${doctor.id}|">
                        <source th:src="${doctor.videoUrl}" type="video/mp4">
                    </video>
                </div>
            </div>

            <!-- Форма редактирования -->
            <div class="edit-form" th:id="|edit-form-${doctor.id}|">
                <form th:action="@{/tg/admin/doctors/{id}/update(id=${doctor.id})}" method="post" enctype="multipart/form-data">
                    <label>Новое ФИО:</label><br>
                    <input type="text" name="fullName" th:value="${doctor.fullName}" required style="width:100%; padding:8px; margin:8px 0;"><br>

                    <label>Новое фото (оставь пустым, чтобы не менять):</label><br>
                    <input type="file" name="photo" accept="image/*"><br><br>

                    <label>Новое видео (оставь пустым, чтобы не менять):</label><br>
                    <input type="file" name="video" accept="video/*"><br><br>

                    <button type="submit" style="padding:10px 20px; background:#f39c12; color:white; border:none; border-radius:6px;">Сохранить изменения</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleEdit(id) {
        document.getElementById('edit-form-' + id).classList.toggle('show');
    }
</script>
</body>
</html>
